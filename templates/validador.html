<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificación de Situación Fiscal</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 font-sans">
    <div class="max-w-md mx-auto min-h-screen flex flex-col shadow-xl bg-white">
        
        <div class="bg-[#13322b] p-4 text-white flex justify-between items-center">
            <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/b/b3/SAT_logo.svg/512px-SAT_logo.svg.png" class="h-8 brightness-0 invert" alt="SAT">
            <span class="text-xs font-bold uppercase tracking-widest">Gobierno de México</span>
        </div>

        <div class="p-6">
            <div class="text-center mb-6">
                <div class="inline-flex items-center justify-center w-16 h-16 bg-green-100 rounded-full mb-2">
                    <svg class="w-10 h-10 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
                    </svg>
                </div>
                <h1 class="text-xl font-bold text-gray-800">Documento Válido</h1>
                <p class="text-sm text-gray-500">La información coincide con los registros</p>
            </div>

            <div class="space-y-4 border-t border-b py-6 my-4">
                <div>
                    <label class="text-[10px] text-gray-400 font-bold uppercase tracking-tighter">RFC Consultado</label>
                    <p class="text-lg font-mono font-bold text-gray-800 tracking-widest">{{ rfc }}</p>
                </div>
                <div>
                    <label class="text-[10px] text-gray-400 font-bold uppercase tracking-tighter">Identificador CIF (idCIF)</label>
                    <p class="text-md font-mono text-gray-700 tracking-wider">{{ idcif }}</p>
                </div>
                <div class="bg-green-50 p-3 rounded-lg border border-green-200">
                    <label class="text-[10px] text-green-700 font-bold uppercase tracking-tighter">Estado en el Padrón</label>
                    <p class="text-md font-bold text-green-800">ACTIVO</p>
                </div>
            </div>

            <div class="text-[10px] text-gray-400 text-justify leading-relaxed">
                Esta consulta confirma que la Cédula de Identificación Fiscal fue emitida por la autoridad competente. Fecha de verificación: <span class="font-bold">{{ datetime }}</span>.
            </div>
        </div>

        <div class="mt-auto p-4 bg-gray-100 border-t">
            <button onclick="window.close()" class="w-full bg-[#13322b] text-white py-3 rounded font-bold text-sm uppercase">Cerrar Validación</button>
        </div>
    </div>
</body>
</html>
