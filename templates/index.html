<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Generar Constancia Fiscal</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f4f7;
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 420px;
            margin: 60px auto;
            background: #fff;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 8px 25px rgba(0,0,0,.1);
        }
        h1 {
            text-align: center;
            font-size: 20px;
            margin-bottom: 20px;
        }
        label {
            font-size: 14px;
            font-weight: bold;
            display: block;
            margin-top: 15px;
        }
        input {
            width: 100%;
            padding: 10px;
            font-size: 15px;
            margin-top: 6px;
            border-radius: 6px;
            border: 1px solid #ccc;
            text-transform: uppercase;
        }
        button {
            width: 100%;
            margin-top: 25px;
            padding: 12px;
            font-size: 16px;
            background: #005ea6;
            color: #fff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
        button:hover {
            background: #004b86;
        }
        .note {
            margin-top: 15px;
            font-size: 12px;
            color: #666;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Generar PDF CSF</h1>

    <form action="/procesar" method="POST">
        <label for="curp">CURP</label>
        <input
            type="text"
            id="curp"
            name="curp"
            placeholder="PERJ821004HDFRDR02"
            maxlength="18"
            required
        >

        <label for="nombre">Nombre completo</label>
        <input
            type="text"
            id="nombre"
            name="nombre"
            placeholder="JORGE ALDO PEREZ RODRIGUEZ"
            required
        >

        <button type="submit">
            Generar PDF
        </button>
    </form>

    <div class="note">
        El documento se genera automáticamente en formato PDF.
    </div>
</div>

</body>
</html>
