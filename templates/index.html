<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador Fiscal - Reconstructor Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .sat-gradient {
            background: linear-gradient(135deg, #13322b 0%, #0b1d19 100%);
        }
    </style>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full bg-white rounded-3xl shadow-2xl overflow-hidden border border-slate-200">
        <div class="sat-gradient p-8 text-white text-center">
            <div class="inline-block p-3 bg-white/10 rounded-2xl mb-4 backdrop-blur-md">
                <svg class="w-10 h-10 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                </svg>
            </div>
            <h1 class="text-2xl font-black uppercase tracking-tighter">Panel de Control</h1>
            <p class="text-xs font-medium opacity-70 mt-1 uppercase tracking-widest">Generación por Reconstructor de Servidor</p>
        </div>

        <form action="/procesar" method="POST" class="p-8 space-y-5">
            
            <div>
                <label class="block text-[10px] font-black text-slate-400 uppercase mb-2 tracking-widest">CURP del Contribuyente</label>
                <input type="text" name="curp" required maxlength="18" 
                    class="w-full bg-slate-50 border-2 border-slate-100 rounded-2xl p-4 focus:border-[#802428] outline-none transition-all font-mono uppercase text-sm shadow-sm"
                    placeholder="XXXX000000XXXXXX00">
            </div>

            <div>
                <label class="block text-[10px] font-black text-slate-400 uppercase mb-2 tracking-widest">Nombre Completo</label>
                <input type="text" name="nombre" required
                    class="w-full bg-slate-50 border-2 border-slate-100 rounded-2xl p-4 focus:border-[#802428] outline-none transition-all uppercase text-sm shadow-sm"
                    placeholder="NOMBRE(S) APELLIDOS">
            </div>

            <div>
                <label class="block text-[10px] font-black text-slate-400 uppercase mb-2 tracking-widest">Sede de Emisión</label>
                <select name="sede" 
                    class="w-full bg-slate-50 border-2 border-slate-100 rounded-2xl p-4 focus:border-[#802428] outline-none transition-all text-sm shadow-sm appearance-none">
                    <option value="ADSC MICHOACÁN &quot;1&quot; MORELIA">ADSC MICHOACÁN "1" MORELIA</option>
                    <option value="ADSC DISTRITO FEDERAL &quot;1&quot;">ADSC DISTRITO FEDERAL "1"</option>
                    <option value="ADSC JALISCO &quot;1&quot; GUADALAJARA">ADSC JALISCO "1" GUADALAJARA</option>
                    <option value="ADSC NUEVO LEÓN &quot;1&quot; MONTERREY">ADSC NUEVO LEÓN "1" MONTERREY</option>
                </select>
            </div>

            <div class="pt-4">
                <button type="submit" 
                    class="w-full sat-gradient text-white font-black py-5 rounded-2xl hover:scale-[1.02] active:scale-95 transition-all shadow-xl uppercase text-xs tracking-[0.2em]">
                    Generar y Descargar PNG
                </button>
            </div>
            
            <p class="text-[9px] text-center text-slate-400 uppercase font-bold tracking-tighter">
                El servidor procesará la plantilla.png con coordenadas exactas.
            </p>
        </form>
    </div>

</body>
</html>
