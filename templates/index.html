<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Control - Laboratorio Fiscal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        .dato-dinamico {
            position: absolute;
            font-family: 'Helvetica', 'Arial', sans-serif;
            color: #000;
            text-transform: uppercase;
            font-weight: bold;
            pointer-events: none;
            line-height: 1;
        }
    </style>
</head>
<body class="bg-slate-100 min-h-screen p-4">
    <div class="max-w-5xl mx-auto grid grid-cols-1 lg:grid-cols-12 gap-6">
        
        <div class="lg:col-span-4 bg-white p-6 rounded-2xl shadow-xl border-t-8 border-[#802428]">
            <h2 class="text-xl font-black text-slate-800 mb-6 tracking-tight uppercase">Panel de Control</h2>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">CURP del Contribuyente</label>
                    <input type="text" id="curp" maxlength="18" class="w-full bg-slate-50 border-2 border-slate-200 rounded-xl p-3 focus:border-[#802428] outline-none uppercase font-mono text-sm" placeholder="XXXX000000XXXXXX00">
                </div>

                <div>
                    <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Oficina de Emisión</label>
                    <select id="sede" class="w-full bg-slate-50 border-2 border-slate-200 rounded-xl p-3 outline-none text-sm">
                        <option value="AUTO">Automático según Estado</option>
                        <option value="ADSC MICHOACÁN \"1\" MORELIA">ADSC MICHOACÁN "1" MORELIA</option>
                        <option value="ADSC DISTRITO FEDERAL \"1\"">ADSC DISTRITO FEDERAL "1"</option>
                    </select>
                </div>

                <div>
                    <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Fecha (Opcional)</label>
                    <input type="date" id="fecha" class="w-full bg-slate-50 border-2 border-slate-200 rounded-xl p-3 outline-none text-sm">
                </div>

                <div class="pt-4 space-y-3">
                    <button onclick="generarVistaPrevia()" class="w-full bg-slate-900 text-white font-bold py-4 rounded-xl hover:bg-black transition-all shadow-lg uppercase text-xs tracking-widest">
                        Generar Vista Previa
                    </button>
                    <button onclick="descargarPDF()" class="w-full bg-[#802428] text-white font-bold py-4 rounded-xl hover:bg-red-900 transition-all shadow-lg uppercase text-xs tracking-widest">
                        Descargar PDF
                    </button>
                </div>
            </div>
        </div>

        <div class="lg:col-span-8 flex justify-center">
            <div id="canvas-container" class="relative bg-white shadow-2xl border" style="width: 800px; height: 1050px; min-width: 800px;">
                <img src="/plantilla.png" id="bg-plantilla" class="absolute inset-0 w-full h-full object-fill" onerror="this.src='https://via.placeholder.com/800x1050?text=Error+al+cargar+plantilla.png'">
                
                <div id="capa-datos" class="absolute inset-0 hidden">
                    <img id="render-qr" class="dato-dinamico" style="top: 155px; left: 638px; width: 125px;">
                    
                    <div id="render-lugar-fecha" class="dato-dinamico" style="top: 232px; left: 590px; width: 190px; text-align: center; font-size: 9px;"></div>
                    
                    <div id="render-rfc" class="dato-dinamico" style="top: 185px; left: 245px; font-size: 14px; letter-spacing: 1px;"></div>
                    
                    <div id="render-idcif" class="dato-dinamico" style="top: 275px; left: 285px; font-size: 11px;"></div>
                    
                    <div id="render-curp" class="dato-dinamico" style="top: 395px; left: 385px; font-size: 11px;"></div>
                </div>

                <div id="placeholder" class="absolute inset-0 flex items-center justify-center bg-slate-50">
                    <p class="text-slate-300 font-black uppercase tracking-[0.2em]">Esperando Datos</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        async function generarVistaPrevia() {
            const curp = document.getElementById('curp').value;
            const sede = document.getElementById('sede').value;
            const fecha = document.getElementById('fecha').value;

            if (curp.length < 10) { alert("CURP inválida"); return; }

            const response = await fetch('/generar', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ curp, sede, fecha })
            });

            const res = await response.json();
            if (res.status === 'success') {
                const d = res.datos;
                document.getElementById('render-qr').src = d.qr;
                document.getElementById('render-lugar-fecha').innerText = `${d.sede} A ${d.fecha}`;
                document.getElementById('render-rfc').innerText = d.rfc;
                document.getElementById('render-curp').innerText = d.curp;
                document.getElementById('render-idcif').innerText = d.idcif;

                document.getElementById('capa-datos').classList.remove('hidden');
                document.getElementById('placeholder').classList.add('hidden');
            }
        }

        async function descargarPDF() {
            const { jsPDF } = window.jspdf;
            const element = document.getElementById('canvas-container');
            
            const canvas = await html2canvas(element, { 
                scale: 3, 
                useCORS: true,
                allowTaint: true
            });
            
            const imgData = canvas.toDataURL('image/png');
            const pdf = new jsPDF('p', 'mm', 'letter');
            pdf.addImage(imgData, 'PNG', 0, 0, 216, 279);
            pdf.save(`Constancia_${document.getElementById('curp').value}.pdf`);
        }
    </script>
</body>
</html>
