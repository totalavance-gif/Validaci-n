<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Control Fiscal</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-white rounded-3xl shadow-2xl p-8">
        <h1 class="text-2xl font-black mb-6 text-center text-slate-800">GENERADOR ALTA RES</h1>
        
        <form action="/procesar" method="POST" class="space-y-6">
            <div>
                <label class="block text-xs font-bold text-slate-500 mb-2">CURP DEL CONTRIBUYENTE</label>
                <input type="text" name="curp" required maxlength="18" class="w-full p-4 bg-slate-100 border-2 border-transparent focus:border-red-700 rounded-2xl outline-none uppercase font-mono shadow-inner">
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-500 mb-2">NOMBRE COMPLETO</label>
                <input type="text" name="nombre" required class="w-full p-4 bg-slate-100 border-2 border-transparent focus:border-red-700 rounded-2xl outline-none uppercase shadow-inner">
            </div>

            <button type="submit" class="w-full bg-red-800 text-white font-bold py-5 rounded-2xl hover:bg-black transition-all shadow-xl uppercase tracking-widest">
                Descargar PNG Final
            </button>
            
            <p class="text-[10px] text-center text-slate-400 font-bold">EMISIÓN POR DEFECTO: CUAUHTÉMOC, CDMX</p>
        </form>
    </div>
</body>
</html>
