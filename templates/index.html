<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador Fiscal - Laboratorio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        .dato-dinamico {
            position: absolute;
            font-family: 'Helvetica', Arial, sans-serif;
            color: #000;
            text-transform: uppercase;
            font-weight: bold;
            pointer-events: none;
            display: flex;
            align-items: center;
        }
        /* Contenedor con la proporción de tu mapa (aprox 2500px de ancho) */
        #canvas-container {
            width: 800px;
            height: 1131px;
            background-color: #fff;
            position: relative;
            overflow: hidden;
        }
    </style>
</head>
<body class="bg-slate-100 min-h-screen p-4">
    <div class="max-w-6xl mx-auto grid grid-cols-1 lg:grid-cols-12 gap-6">
        
        <div class="lg:col-span-4 bg-white p-6 rounded-2xl shadow-xl border-t-8 border-[#802428]">
            <h2 class="text-xl font-black text-slate-800 mb-6 uppercase tracking-tighter">Panel de Control</h2>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">CURP</label>
                    <input type="text" id="curp" maxlength="18" class="w-full bg-slate-50 border-2 border-slate-200 rounded-xl p-3 focus:border-[#802428] outline-none uppercase font-mono shadow-inner">
                </div>

                <div>
                    <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Nombre Completo</label>
                    <input type="text" id="nombre_input" class="w-full bg-slate-50 border-2 border-slate-200 rounded-xl p-3 focus:border-[#802428] outline-none uppercase shadow-inner" placeholder="NOMBRE(S) APELLIDOS">
                </div>

                <div>
                    <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Sede de Emisión</label>
                    <select id="sede" class="w-full bg-slate-50 border-2 border-slate-200 rounded-xl p-3 outline-none shadow-inner">
                        <option value="AUTO">Automático por CURP</option>
                        <option value="ADSC MICHOACÁN \"1\" MORELIA">ADSC MICHOACÁN "1" MORELIA</option>
                        <option value="ADSC DISTRITO FEDERAL \"1\"">ADSC DISTRITO FEDERAL "1"</option>
                    </select>
                </div>

                <div class="pt-4 space-y-3">
                    <button onclick="generarVistaPrevia()" class="w-full bg-slate-900 text-white font-bold py-4 rounded-xl hover:bg-black transition-all shadow-lg uppercase text-xs">
                        Actualizar Vista Previa
                    </button>
                    <button onclick="descargarPDF()" class="w-full bg-[#802428] text-white font-bold py-4 rounded-xl hover:bg-red-900 transition-all shadow-lg uppercase text-xs">
                        Descargar Constancia PDF
                    </button>
                </div>
            </div>
        </div>

        <div class="lg:col-span-8 flex justify-center bg-slate-300 p-4 rounded-3xl shadow-inner overflow-auto">
            <div id="canvas-container" class="shadow-2xl">
                <img src="/plantilla.png" id="bg-image" class="absolute inset-0 w-full h-full object-fill" crossorigin="anonymous">
                
                <div id="capa-datos" class="absolute inset-0 hidden">
                    
                    <img id="render-qr" class="dato-dinamico" style="top: 25.5%; left: 6.8%; width: 16.5%;">
                    
                    <div id="render-rfc" class="dato-dinamico" style="top: 21.5%; left: 24.5%; font-size: 14px; width: 22%;"></div>
                    
                    <div id="render-nombre" class="dato-dinamico" style="top: 27.2%; left: 25.5%; font-size: 13px; width: 25%;"></div>
                    
                    <div id="render-idcif" class="dato-dinamico" style="top: 35%; left: 33.5%; font-size: 12px; width: 15%;"></div>
                    
                    <div id="render-lugar-fecha" class="dato-dinamico" style="top: 31%; left: 56%; width: 42%; font-size: 9px; text-align: left;"></div>

                </div>
            </div>
        </div>
    </div>

    <script>
        async function generarVistaPrevia() {
            const curp = document.getElementById('curp').value;
            const sede = document.getElementById('sede').value;
            const nombre = document.getElementById('nombre_input').value;

            const response = await fetch('/generar', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ curp, sede, nombre })
            });

            const res = await response.json();
            if (res.status === 'success') {
                const d = res.datos;
                document.getElementById('render-qr').src = d.qr;
                document.getElementById('render-rfc').innerText = d.rfc;
                document.getElementById('render-nombre').innerText = nombre || "CONTRIBUYENTE EJEMPLO";
                document.getElementById('render-idcif').innerText = d.idcif;
                document.getElementById('render-lugar-fecha').innerText = `${d.sede} A ${d.fecha}`;

                document.getElementById('capa-datos').classList.remove('hidden');
            }
        }

        async function descargarPDF() {
            const { jsPDF } = window.jspdf;
            const element = document.getElementById('canvas-container');
            
            const canvas = await html2canvas(element, { 
                scale: 3, 
                useCORS: true,
                allowTaint: true
            });
            
            const pdf = new jsPDF('p', 'mm', 'letter');
            pdf.addImage(canvas.toDataURL('image/png'), 'PNG', 0, 0, 216, 279);
            pdf.save(`Constancia_${document.getElementById('curp').value || 'SAT'}.pdf`);
        }
    </script>
</body>
</html>
