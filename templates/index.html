<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador Fiscal Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        .dato-dinamico {
            position: absolute;
            font-family: 'Helvetica', Arial, sans-serif;
            color: #000;
            text-transform: uppercase;
            font-weight: bold;
            pointer-events: none;
        }
        /* Asegura que el contenedor mantenga la proporción de una hoja */
        #canvas-container {
            width: 800px;
            height: 1131px; /* Proporción A4/Carta aproximada */
            background-color: white;
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen p-4">
    <div class="max-w-6xl mx-auto grid grid-cols-1 lg:grid-cols-12 gap-6">
        
        <div class="lg:col-span-4 bg-white p-6 rounded-2xl shadow-xl border-t-8 border-[#802428] h-fit">
            <h2 class="text-xl font-bold text-slate-800 mb-6 uppercase tracking-tight">Panel de Control</h2>
            <div class="space-y-4">
                <input type="text" id="curp" placeholder="CURP" class="w-full p-3 border-2 rounded-xl uppercase font-mono shadow-sm">
                <select id="sede" class="w-full p-3 border-2 rounded-xl shadow-sm">
                    <option value="AUTO">Automático según Estado</option>
                    <option value="ADSC MICHOACÁN \"1\" MORELIA">ADSC MICHOACÁN "1" MORELIA</option>
                </select>
                <input type="date" id="fecha" class="w-full p-3 border-2 rounded-xl shadow-sm">
                
                <button onclick="generarVistaPrevia()" class="w-full bg-slate-900 text-white font-bold py-4 rounded-xl hover:scale-[1.02] transition-transform uppercase text-xs">
                    Generar Vista Previa
                </button>
                <button onclick="descargarPDF()" class="w-full bg-[#802428] text-white font-bold py-4 rounded-xl hover:scale-[1.02] transition-transform uppercase text-xs">
                    Descargar PDF
                </button>
            </div>
        </div>

        <div class="lg:col-span-8 flex justify-center bg-slate-200 p-4 rounded-3xl overflow-auto">
            <div id="canvas-container" class="relative shadow-2xl origin-top scale-[0.8] lg:scale-100">
                <img id="bg-image" src="/plantilla.png" class="absolute inset-0 w-full h-full object-contain" crossorigin="anonymous">
                
                <div id="capa-datos" class="absolute inset-0 hidden">
                    <img id="render-qr" class="dato-dinamico" style="top: 145px; left: 630px; width: 130px;">
                    
                    <div id="render-lugar-fecha" class="dato-dinamico" style="top: 228px; left: 580px; width: 210px; text-align: center; font-size: 8px;"></div>
                    
                    <div id="render-rfc" class="dato-dinamico" style="top: 178px; left: 240px; font-size: 15px;"></div>
                    
                    <div id="render-idcif" class="dato-dinamico" style="top: 270px; left: 280px; font-size: 12px;"></div>
                    
                    <div id="render-curp" class="dato-dinamico" style="top: 392px; left: 380px; font-size: 11px;"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        async function generarVistaPrevia() {
            const curp = document.getElementById('curp').value;
            const sede = document.getElementById('sede').value;
            const fecha = document.getElementById('fecha').value;

            const response = await fetch('/generar', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ curp, sede, fecha })
            });

            const res = await response.json();
            if (res.status === 'success') {
                const d = res.datos;
                document.getElementById('render-qr').src = d.qr + "&t=" + new Date().getTime(); // Cache busting
                document.getElementById('render-lugar-fecha').innerText = `${d.sede} A ${d.fecha}`;
                document.getElementById('render-rfc').innerText = d.rfc;
                document.getElementById('render-curp').innerText = d.curp;
                document.getElementById('render-idcif').innerText = d.idcif;
                
                document.getElementById('capa-datos').classList.remove('hidden');
            }
        }

        async function descargarPDF() {
            const { jsPDF } = window.jspdf;
            const container = document.getElementById('canvas-container');
            
            // Forzamos que la imagen base esté cargada antes de capturar
            const canvas = await html2canvas(container, {
                scale: 3,
                useCORS: true,
                allowTaint: false,
                backgroundColor: null
            });
            
            const pdf = new jsPDF('p', 'mm', 'letter');
            pdf.addImage(canvas.toDataURL('image/png'), 'PNG', 0, 0, 216, 279);
            pdf.save(`Constancia_${document.getElementById('curp').value || 'Generada'}.pdf`);
        }
    </script>
</body>
</html>
