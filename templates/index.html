<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Constancia de Situación Fiscal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f7f6; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .card { border: none; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .btn-primary { background-color: #630015; border: none; padding: 12px; font-weight: bold; }
        .btn-primary:hover { background-color: #4a0010; }
        .header-logo { max-width: 200px; margin-bottom: 20px; }
        .form-label { font-weight: 600; color: #555; }
    </style>
</head>
<body>

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card p-4">
                <div class="text-center">
                    <h3 class="mb-4">Generador de CSF</h3>
                    <p class="text-muted">Ingresa los datos del contribuyente para generar el PDF.</p>
                </div>
                
                <form action="/procesar" method="POST" id="csfForm">
                    <div class="mb-3">
                        <label for="nombre" class="form-label">Nombre o Razón Social</label>
                        <input type="text" class="form-control" id="nombre" name="nombre" placeholder="EJ. JORGE ALDO PEREZ RODRIGUEZ" required style="text-transform: uppercase;">
                    </div>

                    <div class="mb-3">
                        <label for="curp" class="form-label">CURP</label>
                        <input type="text" class="form-control" id="curp" name="curp" maxlength="18" placeholder="18 caracteres" required style="text-transform: uppercase;">
                        <div id="curpHelp" class="form-text">De aquí se derivará automáticamente el RFC.</div>
                    </div>

                    <hr class="my-4">

                    <div class="alert alert-info" style="font-size: 0.85rem;">
                        <strong>Nota:</strong> Los datos de domicilio y regímenes se generarán con los valores por defecto de la plantilla configurada en el servidor.
                    </div>

                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-file-earmark-pdf"></i> Generar Constancia (PDF)
                        </button>
                    </div>
                </form>

                <div class="mt-4 text-center">
                    <small class="text-muted">© 2026 Herramientas Fiscales Digitales</small>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // Validación básica y forzar mayúsculas
    const form = document.getElementById('csfForm');
    const inputs = form.querySelectorAll('input[type="text"]');

    inputs.forEach(input => {
        input.addEventListener('input', () => {
            input.value = input.value.toUpperCase();
        });
    });

    form.onsubmit = function() {
        const curp = document.getElementById('curp').value;
        if (curp.length < 18) {
            alert("La CURP debe tener exactamente 18 caracteres.");
            return false;
        }
        return true;
    };
</script>

</body>
</html>
